<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Success Hub | Enquiry</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <nav>
            <h1>Student Success Hub</h1>

            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="study-resources.html">Study Resources</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="page-header">
            <h2>Student Enquiry</h2>
            <p>Have a question? Send us an enquiry.</p>
        </section>

        <section class="form-section">

            <form>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="student-number">Student Number:</label>
                <input type="text" id="student-number" name="student-number">

                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>

                <label for="message">Your Enquiry:</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Submit Enquiry</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Student Success Hub. All rights reserved.</p>
    </footer>

</body>
</html>
